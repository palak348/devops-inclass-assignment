# MINI PROJECT - the same stack with all FOUR faults corrected.
# Each fix is marked with "FIX n".
---
apiVersion: v1
kind: Namespace
metadata:
  name: voteapp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: voteapp
data:
  API_PORT: "80"
  LOG_LEVEL: "debug"
  REDIS_HOST: "redis-svc.voteapp.svc.cluster.local"   # FIX 2: missing key added
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: voteapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine        # FIX 1: tag that actually exists
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: voteapp
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: voteapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "api on $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: REDIS_HOST
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: voteapp
spec:
  selector:
    app: api                  # FIX 3: was "api-backend" - matched no Pods
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voteapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "frontend on $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m           # FIX 4: was 8 CPUs / 16Gi - unschedulable
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: voteapp
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30141
