# MINI PROJECT - a 3-tier "voting app" stack with FOUR faults planted in it.
# The task: get the whole stack healthy using only kubectl.
#
#   frontend (nginx)  ->  api (nginx)  ->  redis
#
# Deploy this, then work through it. The faults are NOT labelled here on
# purpose - see README.md for the investigation.
---
apiVersion: v1
kind: Namespace
metadata:
  name: voteapp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: voteapp
data:
  API_PORT: "80"
  LOG_LEVEL: "debug"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: voteapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine-nonexistent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: voteapp
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: voteapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "api on $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: REDIS_HOST
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: voteapp
spec:
  selector:
    app: api-backend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voteapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "frontend on $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 8
              memory: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: voteapp
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30141
