# ISSUE 5: stuck in ContainerCreating
# The Pod mounts a ConfigMap that was never created, so the volume cannot be
# set up and the container is never created.
apiVersion: v1
kind: Pod
metadata:
  name: issue-containercreating
  namespace: session14
spec:
  containers:
    - name: web
      image: nginx:1.25-alpine
      volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: config
      configMap:
        name: nginx-config-missing      # <-- does not exist
