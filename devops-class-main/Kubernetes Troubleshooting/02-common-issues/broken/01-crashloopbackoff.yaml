# ISSUE 1: CrashLoopBackOff
# The container exits with code 1 a few seconds after starting. restartPolicy
# defaults to Always, so kubelet restarts it with an increasing back-off.
apiVersion: v1
kind: Pod
metadata:
  name: issue-crashloop
  namespace: session14
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "starting application..."
          echo "ERROR: config file /etc/app/config.yaml not found"
          sleep 3
          exit 1
