# ISSUE 7: Pod networking - the Service targets a port the container
# does not listen on. Endpoints EXIST, but connections are refused.
apiVersion: v1
kind: Service
metadata:
  name: healthy-app-wrongport
  namespace: session14
spec:
  selector:
    app: healthy-app
  ports:
    - port: 80
      targetPort: 8080      # <-- nginx listens on 80, not 8080
