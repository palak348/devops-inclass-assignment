# BROKEN #3: the Ingress points at a Service that does not exist.
# The real Service is "app-one-svc", not "app-one-service".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: broken-ingress
  namespace: session12
spec:
  ingressClassName: nginx
  rules:
    - host: broken.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-one-service   # <-- wrong Service name
                port:
                  number: 80
