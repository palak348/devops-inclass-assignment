# BROKEN #2: the Pod mounts a Secret that does not exist.
# The real Secret is called "app-secret", not "app-secrets".
apiVersion: v1
kind: Pod
metadata:
  name: broken-secret
  namespace: session12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secrets    # <-- typo: trailing "s"
