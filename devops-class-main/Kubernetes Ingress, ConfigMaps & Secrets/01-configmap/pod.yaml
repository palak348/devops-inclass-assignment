apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
  namespace: session12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]

      # METHOD 1: inject individual keys as environment variables
      env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_NAME
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL

      # METHOD 2: inject EVERY key at once as environment variables
      envFrom:
        - configMapRef:
            name: app-config

      # METHOD 3: mount the ConfigMap as files in a volume
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true

  volumes:
    - name: config-volume
      configMap:
        name: app-config
