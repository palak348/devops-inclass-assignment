apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: session12
data:
  # Simple key/value pairs - injected as environment variables
  APP_NAME: "DevOps Demo App"
  APP_ENV: "production"
  LOG_LEVEL: "debug"
  MAX_CONNECTIONS: "100"

  # A multi-line value - mounted as a FILE inside the container
  app.properties: |
    server.port=8080
    server.timeout=30
    feature.newUI=enabled
    cache.enabled=true
