apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: session16
  labels:
    app: cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
        - name: app
          # The CD pipeline replaces this tag with the commit SHA.
          image: ghcr.io/palak348/devops-inclass-assignment/cicd-demo:latest
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: ENVIRONMENT
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-svc
  namespace: session16
spec:
  type: NodePort
  selector:
    app: cicd-demo
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30161
