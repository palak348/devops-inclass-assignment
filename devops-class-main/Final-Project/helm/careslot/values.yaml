# Default values for the CareSlot chart.
# Environment files layer on top:  values-minikube.yaml (local), values-eks.yaml (AWS).

imagePullSecrets: []   # e.g. [{name: ghcr-pull}] if the GHCR packages are private

backend:
  image:
    repository: ghcr.io/palak348/devops-inclass-assignment/careslot-backend
    tag: ""            # CI sets this to the commit SHA; empty = .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 2      # ignored while the HPA is enabled (HPA owns the count)
  port: 8000
  resources:
    requests: {cpu: 100m, memory: 160Mi}
    limits: {cpu: 500m, memory: 384Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

frontend:
  image:
    repository: ghcr.io/palak348/devops-inclass-assignment/careslot-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

postgres:
  image: postgres:16-alpine
  database: careslot
  username: careslot
  # Leave empty: a random password is generated on first install and kept on
  # upgrades. Set it with --set postgres.password=... only if you must.
  password: ""
  storage:
    size: 2Gi
    storageClass: ""   # "" = cluster default (minikube: standard, EKS: gp2)
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ingress:
  enabled: true
  className: nginx
  host: careslot.local   # "" = match any host (e.g. the AWS load balancer hostname)
  annotations: {}

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    # Must match the kube-prometheus-stack release name (see monitoring/README.md).
    releaseLabel: monitoring
  grafanaDashboard:
    enabled: true
