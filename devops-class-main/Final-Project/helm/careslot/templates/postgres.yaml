{{- $name := include "careslot.postgresHost" . -}}
{{- $secret := include "careslot.postgresSecret" . -}}
{{- if not .Values.postgres.existingSecret }}
{{- /* Helm installs: reuse the password already in the cluster so upgrades don't
       break the DB login. (Argo CD renders charts with `helm template`, where
       `lookup` returns nothing - so GitOps installs use postgres.existingSecret.) */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret -}}
{{- $password := .Values.postgres.password -}}
{{- if not $password -}}
  {{- if and $existing $existing.data -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgres.database | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    {{- include "careslot.selector" (list . "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "careslot.selector" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    {{- include "careslot.selector" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "careslot.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "careslot.labels" . | nindent 8 }}
        {{- include "careslot.selector" (list . "postgres") | nindent 8 }}
    spec:
      # uid/gid 70 = the "postgres" user of the alpine image; fsGroup makes the
      # volume writable for it, so the database never runs as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: database}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: password}}
            # Sub-directory: a fresh EBS volume has a lost+found dir at its root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
