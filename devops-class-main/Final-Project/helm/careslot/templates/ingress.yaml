{{- if .Values.ingress.enabled -}}
{{- $fullname := include "careslot.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # /api/* -> FastAPI (the backend routes already start with /api, so no rewrite)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port:
                  number: {{ .Values.backend.port }}
          # everything else -> React app served by Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
