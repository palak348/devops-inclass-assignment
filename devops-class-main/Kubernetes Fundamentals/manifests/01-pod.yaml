apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo-pod
  namespace: k8s-fundamentals
  labels:
    app: nginx-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
