# emptyDir: scratch space created when the Pod is assigned to a node and
# DELETED when the Pod is removed. Shared between containers in the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: session13
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - while true; do echo "$(date) written by writer" >> /shared/data.log; sleep 5; done
      volumeMounts:
        - name: shared-data
          mountPath: /shared

    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared
          readOnly: true

  volumes:
    - name: shared-data
      emptyDir: {}
