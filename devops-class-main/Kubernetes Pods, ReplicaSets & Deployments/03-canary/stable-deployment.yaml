apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  namespace: session10
spec:
  replicas: 4
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo      # shared label - the Service selects on this
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "STABLE VERSION (v1) - pod $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
