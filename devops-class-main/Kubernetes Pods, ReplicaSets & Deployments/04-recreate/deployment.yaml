apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate-app
  namespace: session10
spec:
  replicas: 3
  strategy:
    # Recreate = kill ALL old Pods first, then create the new ones.
    # Causes downtime, but guarantees two versions never run at the same time.
    type: Recreate
  selector:
    matchLabels:
      app: recreate-app
  template:
    metadata:
      labels:
        app: recreate-app
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "RECREATE APP - VERSION 1 - pod $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
