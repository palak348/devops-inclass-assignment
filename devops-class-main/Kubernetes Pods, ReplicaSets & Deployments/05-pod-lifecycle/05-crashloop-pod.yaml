apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-crashloop
  namespace: session10
spec:
  # Always is the default. The container keeps exiting, so kubelet keeps
  # restarting it with an increasing back-off -> CrashLoopBackOff.
  restartPolicy: Always
  containers:
    - name: worker
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'starting...'; sleep 3; exit 1"]
