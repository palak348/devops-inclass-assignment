apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  namespace: session10
spec:
  # Init containers run to completion, one at a time, BEFORE any app container
  # starts. While they run the Pod shows status Init:0/1.
  initContainers:
    - name: init-wait
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'init: preparing...'; sleep 20; echo 'init: done'"]
  containers:
    - name: web
      image: nginx:1.24-alpine
      ports:
        - containerPort: 80
