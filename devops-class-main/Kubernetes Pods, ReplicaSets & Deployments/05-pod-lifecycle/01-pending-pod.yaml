apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pending
  namespace: session10
spec:
  containers:
    - name: web
      image: nginx:1.24-alpine
      resources:
        requests:
          # Deliberately impossible on a single-node Minikube cluster.
          # The scheduler can never place this Pod -> it stays Pending forever.
          cpu: "100"
          memory: "200Gi"
