apiVersion: v1
kind: Service
metadata:
  name: bluegreen-svc
  namespace: session10
spec:
  type: NodePort
  # The switch happens here: changing version: blue -> green moves 100% of
  # traffic to the green Deployment instantly, with no Pod restarts.
  selector:
    app: bluegreen
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30102
