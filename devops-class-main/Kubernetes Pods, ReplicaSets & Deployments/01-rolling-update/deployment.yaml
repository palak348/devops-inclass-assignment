apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-app
  namespace: session10
spec:
  replicas: 4
  # RollingUpdate is the default strategy. It is spelled out here so the
  # surge/unavailable behaviour is explicit and tunable.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # at most 1 extra Pod above replicas during the update
      maxUnavailable: 1    # at most 1 Pod may be unavailable during the update
  selector:
    matchLabels:
      app: rolling-app
  template:
    metadata:
      labels:
        app: rolling-app
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "ROLLING APP - VERSION 1 - pod $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'
          ports:
            - containerPort: 80
