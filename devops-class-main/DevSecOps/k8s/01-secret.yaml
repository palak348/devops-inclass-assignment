# =============================================================================
# The API token.
#
# The value committed here is a PLACEHOLDER and grants access to nothing. In
# the pipeline the real value is written from a GitHub Actions secret:
#
#   kubectl create secret generic notes-api-secret \
#     --from-literal=api-token="$API_TOKEN" -n session17
#
# A base64 string in git is NOT encrypted - `base64 -d` undoes it instantly.
# Anything genuinely sensitive belongs in Sealed Secrets, External Secrets or
# a cloud KMS; that is why this file ships an obvious dummy instead.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: notes-api-secret
  namespace: session17
type: Opaque
stringData:
  api-token: "CHANGE-ME-IN-PRODUCTION-0123456789"
