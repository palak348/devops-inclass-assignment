# Production overrides - more replicas, autoscaling on, quieter logs.
replicaCount: 3

config:
  environment: "production"
  logLevel: "warn"
  welcomeMessage: "Guestbook - PRODUCTION"

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
