apiVersion: v1
kind: Secret
metadata:
  name: {{ include "guestbook.fullname" . }}-secret
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
type: Opaque
data:
  # b64enc encodes the value at render time, so values.yaml stays readable.
  DB_USERNAME: {{ .Values.secrets.dbUsername | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
