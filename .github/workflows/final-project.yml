# =============================================================================
# FINAL PROJECT - CareSlot CI/CD
#
#   test  ──►  build-scan-push  ──►  deploy (GitOps)
#   │          │                     │
#   │          │                     └─ commit the new image SHA to values-eks.yaml;
#   │          │                        Argo CD on EKS syncs it (CI watches the rollout)
#   │          └─ docker build (backend + frontend) → Trivy gate → push to GHCR
#   └─ ruff + pytest (gate) + Alembic on real Postgres + React build
#
# Images are tagged with the commit SHA (never `latest`), so every running Pod
# can be traced back to the exact commit that produced it.
# =============================================================================
name: Final Project - CareSlot CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'devops-class-main/Final-Project/**'
      - '.github/workflows/final-project.yml'
  pull_request:
    branches: [main]
    paths:
      - 'devops-class-main/Final-Project/**'
      - '.github/workflows/final-project.yml'
  workflow_dispatch:

concurrency:
  group: final-project-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: devops-class-main/Final-Project
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  EKS_CLUSTER: careslot-eks
  K8S_NAMESPACE: careslot

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST - first quality gate. A failing test stops the pipeline here, so no
  #    image is ever built from broken code.
  # ---------------------------------------------------------------------------
  test:
    name: 1. Test (pytest + frontend build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careslot
          POSTGRES_USER: careslot
          # Throwaway CI database on the job's private network - no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U careslot -d careslot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -v --junitxml=pytest-report.xml

      - name: Apply Alembic migrations to a real PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://careslot@localhost:5432/careslot
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: ${{ env.APP_DIR }}/backend/pytest-report.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json

      - name: Build React frontend
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ---------------------------------------------------------------------------
  # 2. BUILD + SECURITY SCAN + PUSH
  #    Images are scanned BEFORE they are pushed: an image with a fixable
  #    HIGH/CRITICAL CVE never reaches the registry.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: 2. Build, Trivy scan, push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR rejects upper-case paths, so lower-case owner/repo.
          prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=${prefix}/careslot-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${prefix}/careslot-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build -t "$BACKEND_IMAGE" "$APP_DIR/backend"

      - name: Build frontend image
        run: docker build -t "$FRONTEND_IMAGE" "$APP_DIR/frontend"

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (tagged with the commit SHA)
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          {
            echo "### Images published"
            echo "- \`$BACKEND_IMAGE\`"
            echo "- \`$FRONTEND_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. DEPLOY (GitOps) - CI never runs helm/kubectl against the cluster to deploy.
  #    It records the new desired state in Git (image tags in values-eks.yaml =
  #    this commit's SHA); Argo CD on EKS watches the repo and syncs it.
  #    When AWS secrets exist and the cluster is up, the job then waits for
  #    Argo CD to finish, so the run shows commit -> pipeline -> live rollout.
  #    (Commits pushed with GITHUB_TOKEN do not trigger workflows - no loop.)
  # ---------------------------------------------------------------------------
  deploy:
    name: 3. GitOps deploy (Argo CD)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      VALUES_FILE: devops-class-main/Final-Project/helm/careslot/values-eks.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote the new images in Git (values-eks.yaml)
        id: promote
        run: |
          sed -i -E "s|^(    tag: \")[0-9a-f]{40}(\" # gitops-image-tag.*)$|\1${GITHUB_SHA}\2|" "$VALUES_FILE"
          grep -n 'gitops-image-tag' "$VALUES_FILE"
          test "$(grep -c "tag: \"$GITHUB_SHA\"" "$VALUES_FILE")" -eq 2   # both images updated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "deploy(careslot): promote images to ${GITHUB_SHA::7}" || echo "Tags already at ${GITHUB_SHA::7}"
          for _ in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### GitOps: desired state updated"
            echo "\`values-eks.yaml\` now points at \`${GITHUB_SHA::7}\` (commit \`$(git rev-parse --short HEAD)\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check that the EKS cluster exists
        id: cluster
        if: env.HAS_AWS == 'true'
        run: |
          status=$(aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" --query cluster.status --output text 2>/dev/null || echo MISSING)
          echo "Cluster $EKS_CLUSTER: $status"
          if [ "$status" = "ACTIVE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rollout not watched::EKS cluster $EKS_CLUSTER is $status - Argo CD deploys the new tag when the cluster runs."
            echo "### EKS cluster \`$EKS_CLUSTER\` is $status - rollout not watched" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wait for Argo CD to sync and roll out
        if: steps.cluster.outputs.ready == 'true'
        env:
          WANT_REVISION: ${{ steps.promote.outputs.commit }}
        run: |
          # Ask Argo CD to re-read Git now instead of waiting for its 3-minute poll.
          kubectl -n argocd annotate application careslot argocd.argoproj.io/refresh=normal --overwrite
          for _ in $(seq 1 60); do
            rev=$(kubectl -n argocd get application careslot -o jsonpath='{.status.sync.revision}')
            sync=$(kubectl -n argocd get application careslot -o jsonpath='{.status.sync.status}')
            health=$(kubectl -n argocd get application careslot -o jsonpath='{.status.health.status}')
            echo "$(date +%T) revision=${rev:0:7} sync=$sync health=$health"
            if [ "$rev" = "$WANT_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
              break
            fi
            sleep 10
          done
          [ "$rev" = "$WANT_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/careslot-backend --timeout=5m
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/careslot-frontend --timeout=5m
          # Right after a rollout the HPA has no CPU sample for the new Pods yet
          # (metrics-server needs one scrape), and Argo CD reports it - and so the app -
          # as Degraded for about a minute. Wait for the settled state before reporting.
          for _ in $(seq 1 30); do
            health=$(kubectl -n argocd get application careslot -o jsonpath='{.status.health.status}')
            echo "$(date +%T) health=$health"
            [ "$health" = "Healthy" ] && break
            sleep 10
          done
          [ "$health" = "Healthy" ]

      - name: Show the rollout
        if: steps.cluster.outputs.ready == 'true'
        run: |
          kubectl -n argocd get application careslot
          kubectl -n "$K8S_NAMESPACE" get deploy,pods,svc,ingress,hpa -o wide
          {
            echo "### Argo CD deployed \`${GITHUB_SHA::7}\` to EKS"
            echo '```'
            kubectl -n argocd get application careslot
            kubectl -n "$K8S_NAMESPACE" get pods -o custom-columns=POD:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
