# =============================================================================
# FINAL PROJECT - CareSlot CI/CD
#
#   test  ──►  build-scan-push  ──►  deploy
#   │          │                     │
#   │          │                     └─ helm upgrade --install on EKS
#   │          └─ docker build (backend + frontend) → Trivy gate → push to GHCR
#   └─ ruff + pytest (gate) + Alembic on real Postgres + React build
#
# Images are tagged with the commit SHA (never `latest`), so every running Pod
# can be traced back to the exact commit that produced it.
# =============================================================================
name: Final Project - CareSlot CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'devops-class-main/Final-Project/**'
      - '.github/workflows/final-project.yml'
  pull_request:
    branches: [main]
    paths:
      - 'devops-class-main/Final-Project/**'
      - '.github/workflows/final-project.yml'
  workflow_dispatch:

concurrency:
  group: final-project-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: devops-class-main/Final-Project
  REGISTRY: ghcr.io
  AWS_REGION: ap-south-1
  EKS_CLUSTER: careslot-eks
  K8S_NAMESPACE: careslot

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST - first quality gate. A failing test stops the pipeline here, so no
  #    image is ever built from broken code.
  # ---------------------------------------------------------------------------
  test:
    name: 1. Test (pytest + frontend build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careslot
          POSTGRES_USER: careslot
          # Throwaway CI database on the job's private network - no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U careslot -d careslot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -v --junitxml=pytest-report.xml

      - name: Apply Alembic migrations to a real PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://careslot@localhost:5432/careslot
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: ${{ env.APP_DIR }}/backend/pytest-report.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json

      - name: Build React frontend
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ---------------------------------------------------------------------------
  # 2. BUILD + SECURITY SCAN + PUSH
  #    Images are scanned BEFORE they are pushed: an image with a fixable
  #    HIGH/CRITICAL CVE never reaches the registry.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: 2. Build, Trivy scan, push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR rejects upper-case paths, so lower-case owner/repo.
          prefix="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=${prefix}/careslot-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${prefix}/careslot-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build -t "$BACKEND_IMAGE" "$APP_DIR/backend"

      - name: Build frontend image
        run: docker build -t "$FRONTEND_IMAGE" "$APP_DIR/frontend"

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (tagged with the commit SHA)
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          {
            echo "### Images published"
            echo "- \`$BACKEND_IMAGE\`"
            echo "- \`$FRONTEND_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. DEPLOY - Helm rolls the new SHA-tagged images out to EKS.
  #    Needs repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. When the
  #    secrets are missing or the EKS cluster does not exist (not created yet, or
  #    removed with terraform destroy to save cost) the job skips itself cleanly.
  # ---------------------------------------------------------------------------
  deploy:
    name: 3. Deploy to EKS with Helm
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Skip when no cluster is configured
        if: env.HAS_AWS != 'true'
        run: |
          echo "::notice title=Deploy skipped::AWS secrets not set - provision EKS with Terraform and add AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY to enable deployment."
          echo "### Deploy skipped - no EKS credentials configured" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.HAS_AWS == 'true'

      - name: Configure AWS credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check that the EKS cluster exists
        id: cluster
        if: env.HAS_AWS == 'true'
        run: |
          status=$(aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" --query cluster.status --output text 2>/dev/null || echo MISSING)
          echo "Cluster $EKS_CLUSTER: $status"
          if [ "$status" = "ACTIVE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::EKS cluster $EKS_CLUSTER is $status - run terraform apply to deploy."
            echo "### Deploy skipped - EKS cluster \`$EKS_CLUSTER\` is $status" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Point kubectl at the EKS cluster
        if: steps.cluster.outputs.ready == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - uses: azure/setup-helm@v4
        if: steps.cluster.outputs.ready == 'true'

      - name: helm upgrade --install
        if: steps.cluster.outputs.ready == 'true'
        run: |
          prefix="${{ needs.build-scan-push.outputs.image-prefix }}"
          helm upgrade --install careslot "$APP_DIR/helm/careslot" \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            -f "$APP_DIR/helm/careslot/values-eks.yaml" \
            --set backend.image.repository="${prefix}/careslot-backend" \
            --set backend.image.tag="$GITHUB_SHA" \
            --set frontend.image.repository="${prefix}/careslot-frontend" \
            --set frontend.image.tag="$GITHUB_SHA" \
            --wait --timeout 10m

      - name: Show the rollout
        if: steps.cluster.outputs.ready == 'true'
        run: |
          kubectl -n "$K8S_NAMESPACE" get deploy,pods,svc,ingress,hpa -o wide
          helm -n "$K8S_NAMESPACE" history careslot --max 5
          {
            echo "### Deployed \`$GITHUB_SHA\` to EKS"
            echo '```'
            kubectl -n "$K8S_NAMESPACE" get pods -o custom-columns=POD:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
