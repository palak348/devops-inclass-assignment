# =============================================================================
# CI PIPELINE - Continuous Integration
#
# Runs on every push and pull request. Its job is to answer one question:
# "is this change safe to merge?" It never deploys anything.
# =============================================================================
name: CI Pipeline

# ---- TRIGGERS (events that start the workflow) ------------------------------
on:
  push:
    branches: [main]
    paths:
      - 'devops-class-main/CI-CD & GitHub Actions/app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

# ---- ENVIRONMENT VARIABLES available to every job ---------------------------
env:
  APP_DIR: devops-class-main/CI-CD & GitHub Actions/app
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # JOB 1: LINT - fastest check first, so obvious mistakes fail in seconds
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest        # the RUNNER - a fresh VM provided by GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run syntax check
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

  # ===========================================================================
  # JOB 2: TEST - runs in PARALLEL with lint (no "needs:" dependency)
  # ===========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run unit tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Generate test report
        working-directory: ${{ env.APP_DIR }}
        run: npm test -- --test-reporter=tap > test-results.tap 2>&1 || true

      # ARTIFACT - a file produced by the pipeline, downloadable from the run page
      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/test-results.tap
          retention-days: 7

  # ===========================================================================
  # JOB 3: BUILD - only runs if BOTH lint and test succeeded
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]           # JOB DEPENDENCY - this is what makes it a pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push - CI only verifies it builds)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: false
          tags: cicd-demo:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cicd-demo-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/cicd-demo-image.tar
          retention-days: 3

  # ===========================================================================
  # JOB 4: SUMMARY - demonstrates job outputs and the step summary
  # ===========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()                  # run even if an earlier job failed
    steps:
      - name: Write summary
        run: |
          echo "## CI Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: **${{ github.event_name }}** on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
